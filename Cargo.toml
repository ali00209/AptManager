[package]
name = "apt-manager"
version = "0.3.0"
edition = "2021"

[dependencies]
gpui-kit = "0.9.0"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.deb]
maintainer = "Ali <ah2699514@gmail.com>"
section = "admin"
priority = "optional"
depends = "$auto, policykit-1"
assets = [
    ["target/release/apt-manager", "usr/bin/", "755"],
    ["packaging/apt-manager.desktop", "usr/share/applications/", "644"],
]
